version: 2

updates:
  # Application dependencies. Grouped so a week's patches arrive as one PR
  # instead of a dozen, which keeps the CI queue (and review load) sane.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next/React move together; a split upgrade usually fails to build.
      #
      # `eslint` belongs here too, even though it looks like generic tooling:
      # `eslint-config-next` declares a peer dependency on it, and a major
      # release tightens the range (v16 requires eslint >= 9). Leaving eslint to
      # the dev-dependencies group once let the config move without it, which
      # made `npm ci` unresolvable and took every workflow down with it.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "eslint"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # Keep the CI/publish workflows' actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
