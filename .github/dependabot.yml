version: 2

updates:
  # Application dependencies. Grouped so a week's patches arrive as one PR
  # instead of a dozen, which keeps the CI queue (and review load) sane.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next/React move together; a split upgrade usually fails to build.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # Keep the CI/publish workflows' actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
