name: Publish Docker image

# Build and publish the container image to GitHub Container Registry (GHCR).
# Publishing is limited to the default branch and version tags (feature
# branches are validated by the CI workflow but not published).
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image name = ghcr.io/<owner>/<repo>, lowercased below.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # A hung publish is silent: no failure, no notification, just a run that
    # never ends. One wedged on `Build and push` for over three hours and was
    # only noticed by chance — GitHub's default would have let it sit for six.
    #
    # That matters more than a wasted runner, because this workflow tags
    # `latest`. A stale run finishing after newer commits have published would
    # move `latest` *backwards* onto an older image.
    #
    # Successful runs take 6-12 minutes (the slowest being a cold cache after
    # a base-image change), so 45 is generous headroom for a legitimately slow
    # arm64-under-QEMU build while still failing loudly the same hour.
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR requires a lowercase image path; the repo owner may contain
      # uppercase letters, so normalise it here.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # Stamped into the image so Settings -> Info can name the build.
      - name: Record build time
        id: build
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            # Branch pushes -> branch name (e.g. "main")
            type=ref,event=branch
            # Pull requests -> pr-<number>
            type=ref,event=pr
            # Semver tags (v1.2.3) -> 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Every build -> short commit SHA
            type=sha,format=short
            # Default branch also gets the "latest" tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamped into the image and shown in Settings -> Info, so a bug
          # report can name the exact build it came from.
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.build.outputs.at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
