name: Publish Docker image

# Build and publish the container image to GitHub Container Registry (GHCR).
# Publishing is limited to the default branch and version tags (feature
# branches are validated by the CI workflow but not published).
#
# Each architecture is built on a runner of that architecture and the results
# are stitched into one multi-arch tag at the end. The alternative — one runner
# building both under QEMU — is what this replaced, and it was not merely slow:
# `npm ci` for the arm64 leg hung for 43 minutes under emulation and took the
# publish down with it, on a commit whose only sin was changing the lockfile.
# That layer is normally a cache hit, so the emulated install almost never
# actually ran, which is why the problem stayed hidden until a dependency
# changed. Native runners remove the emulation rather than working around it.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

# One publish at a time, repository-wide.
#
# This workflow moves `latest`, and two runs in flight have no ordering between
# them: whichever finishes last wins. Merge two PRs a minute apart and the older
# commit's run can finish second, leaving `latest` pointing at the *earlier*
# image with nothing failing to say so. Four merges in quick succession stayed
# in order once, but by luck rather than design — the runs happened not to
# overlap.
#
# `cancel-in-progress: false` because a publish is not safe to interrupt: it
# pushes per-architecture digests and only then assembles them, so killing one
# mid-flight can leave digests in the registry that no tag ever references.
# Waiting a few minutes is the cheaper mistake.
#
# Worth knowing: GitHub keeps only the most recent *pending* run per group, so a
# burst of merges will cancel the ones queued behind it and publish the newest.
# Intermediate commits can therefore go without a `sha-` image. That is the
# right trade — those commits were superseded within minutes, and the tag exists
# so a bug report can name the build it came from, which nobody can be running
# if it was never published. `latest` correctness is what matters here.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Image name = ghcr.io/<owner>/<repo>, lowercased in `prepare`.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Values that must be identical across the per-architecture builds. Computing
  # the timestamp inside each build job would stamp the two images with times
  # that disagree, and Settings -> Info reports it as the build time of *the*
  # image — one number, so it has to be decided once.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.name }}
      built_at: ${{ steps.build.outputs.at }}
    steps:
      # GHCR requires a lowercase image path; the repo owner may contain
      # uppercase letters, so normalise it here.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Record build time
        id: build
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}

    # Native builds land in 4-6 minutes. 30 is generous headroom for a cold
    # cache or a slow registry while still failing loudly within the hour.
    #
    # A hung publish is silent: no failure, no notification, just a run that
    # never ends. That matters more than a wasted runner, because this workflow
    # tags `latest` — a stale run finishing after newer commits have published
    # would move `latest` *backwards* onto an older image.
    timeout-minutes: 30

    strategy:
      # One architecture failing should not cancel the other: knowing whether a
      # break is arch-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `linux/amd64` is not usable as a filename or an artifact name.
      - name: Compute platform slug
        id: slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "value=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, without tags: a tag naming one architecture is a tag
      # someone can pull by accident. The `merge` job is what publishes the
      # names, and it publishes them once, pointing at both.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Stamped into the image and shown in Settings -> Info, so a bug
          # report can name the exact build it came from.
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ needs.prepare.outputs.built_at }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture. A shared scope has the two builds evicting
          # each other's layers, so neither ever gets a warm cache.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          # The manifest list is assembled from these filenames, so the file
          # only has to exist and be named after the digest.
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publish the tags, pointing them at a manifest list covering both builds.
  # Nothing is tagged until every architecture has been pushed, so `latest`
  # never names a half-published image.
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }}
          tags: |
            # Branch pushes -> branch name (e.g. "main")
            type=ref,event=branch
            # Pull requests -> pr-<number>
            type=ref,event=pr
            # Semver tags (v1.2.3) -> 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Every build -> short commit SHA
            type=sha,format=short
            # Default branch also gets the "latest" tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the manifest list and push
        working-directory: /tmp/digests
        # REGISTRY comes from the workflow-level `env`, which is already in the
        # shell; only the image name has to be threaded through from `prepare`.
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}

      # Proves the published tag really does cover both architectures, rather
      # than trusting that the merge above did what it was told.
      - name: Inspect the published image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${VERSION}"
