name: CI

# The quality gate, running in parallel:
#
#   verify      — lint, typecheck, unit + integration tests, and the Next build
#   image-build — builds the Docker image the project ships, on amd64 and
#                 arm64, both natively
#   image       — one stable name for the above, so branch protection has
#                 something fixed to require
#
# `verify` and `image` must both be required in branch protection; each covers
# what the other does not. Publishing is a separate workflow, only on `main`.
# `pull_request` covers every branch that has a PR, so `push` is left to `main`
# — which is the only branch it still has to answer for.
#
# Listing every branch here as well produced *two* runs of the whole matrix
# against the same commit, and that is not merely wasteful: it is a merge
# blocker, whichever way the surplus run ends. Both endings were observed.
#
#   - Left to queue, one twin sat unstarted for over an hour while the other
#     passed in three minutes, holding `verify` and `image` pending — the shape
#     `verify`'s `timeout-minutes` comment warns about.
#   - Cancelled by the concurrency group below, the surplus run's checks
#     concluded `cancelled`, and the ruleset counts that as a violation:
#
#         405 Repository rule violations found
#         2 of 2 required status checks are cancelled.
#
#     It reads them even though a *later* check run of each name had succeeded,
#     so "the newest wins" is not something to rely on.
#
# The duplicate therefore has to not exist, rather than be raced or cancelled
# into second place. The cost is that a branch pushed before its PR exists gets
# no CI; opening the PR — a draft is enough — starts it.
on:
  push:
    branches:
      - main
  pull_request:

# One run per branch still, now only against itself.
#
# With the duplicate gone this no longer has two event types to reconcile; what
# it does is supersede an earlier push to the same PR branch, so a quick
# follow-up commit does not leave the previous one's matrix running for nothing.
# That is safe in a way cancelling a same-commit twin was not: those cancelled
# checks belong to the *previous* head SHA, and branch protection only ever
# reads the current one.
#
# The key is still `head_ref || ref_name` because the two events still name the
# branch differently — a push carries `refs/heads/<branch>` in `ref` and no
# `head_ref`, a pull_request carries `refs/pull/<n>/merge` and the branch in
# `head_ref` — and a `main` push must land in the same group as nothing else.
#
# Cancelling is safe here in a way it deliberately is not in
# docker-publish.yml: this workflow only reports, it never pushes an image, so
# an interrupted run leaves nothing half-written to clean up. `main` is still
# exempt — the default branch keeps a complete CI verdict for every commit
# rather than having a merge cancel the run for the one before it. Runs there
# queue behind each other instead, the same trade the publish workflow makes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    # Runs take ~90s (87-99s measured). 20 minutes is far above anything
    # legitimate — a slow npm registry, a sluggish runner, Postgres taking its
    # time to accept connections — while still failing an hour and a half
    # sooner than GitHub's 6-hour default. A job that hangs here holds a
    # required check pending, so the PR blocks with nothing to read.
    timeout-minutes: 20

    # Integration tests run against a throwaway PostgreSQL, so the sync/sweep
    # engines are exercised against real SQL rather than a mocked client.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streamsweeparr
          POSTGRES_PASSWORD: streamsweeparr
          POSTGRES_DB: streamsweeparr_test
        ports:
          - 5432:5432
        # `-d` matters: without it pg_isready defaults the database name to the
        # user name and probes for a "streamsweeparr" database, which does not
        # exist — POSTGRES_DB creates "streamsweeparr_test". The probe still
        # reports the server as up, so the healthcheck passed either way, but
        # every 5s it left a line in the service log:
        #
        #   FATAL:  database "streamsweeparr" does not exist
        #
        # Harmless, and precisely the wrong thing to be scrolling past when
        # reading these logs to diagnose a genuine failure.
        options: >-
          --health-cmd "pg_isready -U streamsweeparr -d streamsweeparr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://streamsweeparr:streamsweeparr@localhost:5432/streamsweeparr_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `.nvmrc` is the single source of truth for the Node major, so CI cannot
      # drift from it by construction. The Dockerfile can't read it, so the step
      # below asserts the image agrees.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Cheap and first: no point installing anything if CI and the shipped
      # image are about to test different runtimes.
      - name: Check Node version alignment
        run: npm run check:node

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # Fail the build on critical advisories, across the whole tree.
      #
      # High and below are reported but not blocking: several Next.js advisories
      # have no fix inside the current line, so gating on them would wedge CI on
      # an upgrade that has to be done deliberately.
      #
      # The blocking check deliberately does NOT pass `--omit=dev`, and that
      # matters more than it looks. Dependabot is configured to ignore major
      # bumps, and its rationale names this step as the backstop for a security
      # fix that only a major can deliver. With dev dependencies omitted that
      # backstop had a hole exactly where the ignore rule creates the risk: a
      # critical advisory in the test runner sat here unreported while CI stayed
      # green. Build-time tooling is part of the supply chain that produces the
      # image, so it is in scope.
      - name: Audit dependencies
        run: |
          npm audit || true
          npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration test
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build
        run: npx next build

  # The image that actually ships, built on every PR — once per architecture.
  #
  # The publish workflow only runs on `main`, so before this existed nothing
  # built the Dockerfile until after merge — a broken base image or a bad COPY
  # was found in the registry rather than in review. Building only amd64 left
  # the same hole one architecture narrower: an arm64-specific break still
  # reached `main` and surfaced at publish, which is the expensive place to
  # find it.
  #
  # Separate jobs rather than steps inside `verify`, so the ~4 minutes they
  # take run alongside the tests instead of after them.
  #
  # No push: a correctness check, not a release. The publish workflow is what
  # pushes, and it builds the same two architectures the same way.
  image-build:
    runs-on: ${{ matrix.runner }}

    # Cached runs take ~90-160s; the first uncached build took just over 4
    # minutes. 20 minutes covers a cold cache plus a slow registry. Both legs
    # are native — nothing here runs under emulation.
    timeout-minutes: 20

    strategy:
      # One architecture failing should not cancel the other: knowing whether
      # a break is arch-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # Scoped per architecture. A shared scope has the two builds evicting
          # each other's layers, so neither ever gets a warm cache.
          cache-from: type=gha,scope=ci-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.platform }}

  # The required check, kept deliberately as one job with a stable name.
  #
  # `image` is named in the branch protection ruleset. Turning it into a matrix
  # directly would have renamed the checks to `image (linux/amd64)` and
  # `image (linux/arm64)`, so the rule would sit waiting for an `image` that no
  # longer reports and every PR would block. This job is what keeps that name,
  # whatever the matrix above grows to.
  #
  # An explicit result test plus a condition that survives a failed dependency,
  # rather than a bare `needs:`, because a job skipped by a failed dependency
  # reports as *skipped* — and a skipped required check can satisfy the rule it
  # was meant to enforce.
  #
  # That condition has to be `!cancelled()` rather than `always()`, and the
  # difference only became visible once the concurrency group above started
  # cancelling superseded runs as a matter of course. `always()` is true *even
  # when the run has been cancelled*, so this job went on to execute inside a
  # cancelled run, read `image-build` as `cancelled`, and exited 1 — reporting
  # the required `image` check as a hard **failure** on a run that had simply
  # been replaced by a newer one. `!cancelled()` overrides the failed-dependency
  # skip exactly as `always()` did, while leaving a cancelled run to be
  # cancelled and the verdict to the run that superseded it.
  #
  # The `${{ }}` is not decorative: `if: !cancelled()` is invalid YAML, since a
  # leading `!` opens a tag.
  image:
    needs: image-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every architecture built
        if: needs.image-build.result != 'success'
        run: |
          echo "image-build concluded: ${{ needs.image-build.result }}"
          exit 1
