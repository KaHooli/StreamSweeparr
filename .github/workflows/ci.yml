name: CI

# The quality gate, in two jobs that run in parallel:
#
#   verify — lint, typecheck, unit + integration tests, and the Next build
#   image  — builds the Docker image the project actually ships
#
# Both must be required in branch protection; each covers what the other does
# not. Publishing the image is a separate workflow that runs only on `main`.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Runs take ~90s (87-99s measured). 20 minutes is far above anything
    # legitimate — a slow npm registry, a sluggish runner, Postgres taking its
    # time to accept connections — while still failing an hour and a half
    # sooner than GitHub's 6-hour default. A job that hangs here holds a
    # required check pending, so the PR blocks with nothing to read.
    timeout-minutes: 20

    # Integration tests run against a throwaway PostgreSQL, so the sync/sweep
    # engines are exercised against real SQL rather than a mocked client.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streamsweeparr
          POSTGRES_PASSWORD: streamsweeparr
          POSTGRES_DB: streamsweeparr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamsweeparr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://streamsweeparr:streamsweeparr@localhost:5432/streamsweeparr_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `.nvmrc` is the single source of truth for the Node major, so CI cannot
      # drift from it by construction. The Dockerfile can't read it, so the step
      # below asserts the image agrees.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Cheap and first: no point installing anything if CI and the shipped
      # image are about to test different runtimes.
      - name: Check Node version alignment
        run: npm run check:node

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # Fail the build on critical advisories in shipped dependencies. High and
      # below are reported but not blocking: several Next.js advisories have no
      # fix inside the 14.x line, so gating on them would wedge CI on an upgrade
      # that has to be done deliberately.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration test
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build
        run: npx next build

  # The image that actually ships, built on every PR.
  #
  # The publish workflow only runs on `main`, so before this existed nothing
  # built the Dockerfile until after merge — a broken base image or a bad COPY
  # was found in the registry rather than in review.
  #
  # A separate job rather than a step inside `verify`, so the ~4 minutes it
  # takes runs alongside the tests instead of after them. The cost of that
  # choice: it is its own required check. `verify` passing no longer implies
  # the image builds, so `image` has to be named in the branch protection
  # ruleset too, or a broken Dockerfile can merge with a green tick.
  #
  # Single-arch and no push: a correctness check, not a release. The publish
  # workflow still does the real multi-arch build.
  image:
    runs-on: ubuntu-latest

    # Cached runs take ~90-160s; the first uncached build took just over 4
    # minutes. 20 minutes covers a cold cache plus a slow registry, and this
    # is the single-arch build — the emulated arm64 one that hung for three
    # hours lives in the publish workflow, which has its own timeout.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
