name: CI

# Lint, typecheck, test and build on every push and pull request. The Docker
# publish workflow runs separately; this job is the quality gate.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Integration tests run against a throwaway PostgreSQL, so the sync/sweep
    # engines are exercised against real SQL rather than a mocked client.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streamsweeparr
          POSTGRES_PASSWORD: streamsweeparr
          POSTGRES_DB: streamsweeparr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamsweeparr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://streamsweeparr:streamsweeparr@localhost:5432/streamsweeparr_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `.nvmrc` is the single source of truth for the Node major, so CI cannot
      # drift from it by construction. The Dockerfile can't read it, so the step
      # below asserts the image agrees.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Cheap and first: no point installing anything if CI and the shipped
      # image are about to test different runtimes.
      - name: Check Node version alignment
        run: npm run check:node

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # Fail the build on critical advisories in shipped dependencies. High and
      # below are reported but not blocking: several Next.js advisories have no
      # fix inside the 14.x line, so gating on them would wedge CI on an upgrade
      # that has to be done deliberately.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration test
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build
        run: npx next build

      # Everything above proves the app works on the Node in `.nvmrc`. This
      # proves the image that actually ships is built on that same Node and
      # still assembles — previously nothing did, because the publish workflow
      # only runs on `main`, so a broken Dockerfile was discovered after merge.
      #
      # Single-arch and no push: this is a correctness check, not a release.
      # The publish workflow still does the real multi-arch build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
