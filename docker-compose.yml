# Convenience compose file. Brings up a PostgreSQL server and the app.
# For development you can run just the `db` service and `npm run dev` locally.
#
# Before `docker compose up`, create a .env next to this file with at least:
#   POSTGRES_PASSWORD=<a strong password>
#   AUTH_SECRET=<openssl rand -hex 32>
# The values below fall back to insecure dev defaults ONLY if unset — do not
# rely on them for anything internet-facing.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamsweeparr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamsweeparr}
      POSTGRES_DB: ${POSTGRES_DB:-streamsweeparr}
    # Bind to localhost only so Postgres is not exposed on all interfaces.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamsweeparr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamsweeparr}:${POSTGRES_PASSWORD:-streamsweeparr}@db:5432/${POSTGRES_DB:-streamsweeparr}?schema=public
      # REQUIRED in production. Generate with: openssl rand -hex 32
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (openssl rand -hex 32) in your .env}
      # Set to "true" if your Sonarr/Radarr live on a private LAN (10/172.16/192.168).
      SSRF_ALLOW_PRIVATE: ${SSRF_ALLOW_PRIVATE:-false}
      # This compose file exposes the app over plain HTTP, so login cookies must
      # NOT be marked Secure (browsers drop Secure cookies on http://). If you
      # put the app behind HTTPS (recommended), set this to "false".
      AUTH_COOKIE_INSECURE: ${AUTH_COOKIE_INSECURE:-true}
      # Only set this to "true" when a reverse proxy you control overwrites the
      # X-Forwarded-* headers. This compose file publishes port 3000 directly,
      # so the headers are client-controlled and must not be trusted.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "3000:3000"
    healthcheck:
      # /api/health is public and checks database reachability.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
